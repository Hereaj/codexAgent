# Portfolio — www.hereaj.com
# Install to /etc/nginx/sites-available/portfolio and symlink into sites-enabled.
# nginx serves the built React app and /attached_assets directly;
# /api is proxied to FastAPI (uvicorn on 127.0.0.1:8000, see portfolio.service).

server {
    listen 80;
    server_name hereaj.com www.hereaj.com;
    return 301 https://www.hereaj.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hereaj.com;

    ssl_certificate /etc/letsencrypt/live/www.hereaj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hereaj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://www.hereaj.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.hereaj.com;

    ssl_certificate /etc/letsencrypt/live/www.hereaj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hereaj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    root /var/www/portfolio/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /attached_assets/ {
        alias /var/www/portfolio/attached_assets/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
